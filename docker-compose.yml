services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: incident-resolution-backend
    command: ["uvicorn", "backend.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=docker
      - DATABASE_URL=sqlite:////app/data/runtime/incidents.db
      - CHROMA_PERSIST_DIR=/app/data/chroma_db
      - RUNBOOKS_DIR=/app/backend/runbooks
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-llama3.1:latest}
      - OLLAMA_TIMEOUT_SECONDS=${OLLAMA_TIMEOUT_SECONDS:-30}
    volumes:
      - ./data:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: incident-resolution-frontend
    command:
      [
        "streamlit",
        "run",
        "frontend/dashboard.py",
        "--server.port=8501",
        "--server.address=0.0.0.0",
        "--server.headless=true"
      ]
    ports:
      - "8501:8501"
    environment:
      - BACKEND_URL=http://backend:8000
    depends_on:
      backend:
        condition: service_healthy

  ollama:
    image: ollama/ollama:latest
    container_name: incident-resolution-ollama
    profiles: ["with-ollama"]
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama

volumes:
  ollama_models:
